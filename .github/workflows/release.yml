name: Release assets

# Builds the HACS zip from the tagged source and signs it with GitHub's build provenance attestation.
# Frieda Postfach has no Python requirements of its own, so there is no SBOM.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build assets for
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Check that manifest version matches the tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION=$(python -c "import json; print(json.load(open('custom_components/friedafetch_mail/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$VERSION"
          test "v$VERSION" = "$TAG"

      - name: Build HACS zip
        run: |
          cd custom_components/friedafetch_mail
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -r -X ../../friedafetch_mail.zip . -x "*.pyc"
          cd ../..
          sha256sum friedafetch_mail.zip | tee friedafetch_mail.zip.sha256

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: friedafetch_mail.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # the Sigstore bundle of the attestation goes along, so the signature can be checked offline
        # (cosign verify-blob-attestation / gh attestation verify --bundle) and is visible to OpenSSF Scorecard
        run: |
          cp "$BUNDLE" friedafetch_mail.zip.sigstore.json
          # the SLSA provenance itself (the DSSE envelope of the bundle), in the usual *.intoto.jsonl form
          python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))['dsseEnvelope']))" "$BUNDLE" > friedafetch_mail.zip.intoto.jsonl
          gh release upload "$TAG" friedafetch_mail.zip friedafetch_mail.zip.sha256 friedafetch_mail.zip.sigstore.json friedafetch_mail.zip.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"
