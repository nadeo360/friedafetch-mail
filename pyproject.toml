[project]
name = "friedafetch-mail"
version = "0.1.0"
description = "Frieda Postfach – inbox rules, push delivery and daily overview on top of Frieda"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests", "tests_imap"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".venv", ".venv314", "custom_components/friedafetch"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["real_mail_state: run the background read/flagged look (mailstate.py) instead of a stub"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", ".venv314", "custom_components/friedafetch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Frieda (custom_components.friedafetch) is linked in for tests only; classify it the same way everywhere.
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
"tests_imap/*" = ["S101", "S105", "S106", "S108", "S603"]  # the test server: asserts, its fixed password, its run directory
"tests/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv314", "custom_components/friedafetch"]
skips = ["B101"]

[tool.basedpyright]
# type check of the integration (CI): pyright's standard rules
include = ["custom_components/friedafetch_mail"]
extraPaths = ["."]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingModuleSource = false
# Home Assistant re-exports its helpers (websocket_api, http) without __all__; importing them from there is its own convention
reportPrivateImportUsage = false
# entities override Home Assistant's cached properties with @property (as Home Assistant's own integrations do)
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
# what was found when the check came (narrowing that pyright cannot follow, gaps in library type hints) is in
# .basedpyright/baseline.json; CI fails on every new finding, and the baseline only shrinks
baselineFile = ".basedpyright/baseline.json"
